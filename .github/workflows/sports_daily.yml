name: nba-nfl-daily

on:
  schedule:
    - cron: "0 15,18,21,0,3 * * *"   # 5 fotos al día (9am, 12pm, 3pm, 6pm y 9pm hora Chicago)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kalshi-escritura      # las dos corridas nunca escriben a la vez
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PROGRESO_CLAVE: ${{ secrets.PROGRESO_CLAVE }}   # clave de los detalles privados de progreso.html
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            data/nba
            data/nfl
          key: espn-data-${{ github.run_id }}
          restore-keys: espn-data-
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Modelo vs Kalshi en mercados ya resueltos, y nuevas predicciones + precios
        run: |
          for lg in nba nfl; do
            python -m kalshi_nba.cli evaluate --league $lg
            python -m kalshi_nba.cli predict  --league $lg --days 7
            python -m kalshi_nba.injuries $lg
          done
      - uses: actions/cache@v4
        with:
          path: data/stats
          key: stats-data-${{ github.run_id }}
          restore-keys: stats-data-
      - name: Estadísticas de equipos para la página (ESPN; si falla no detiene el resto)
        continue-on-error: true
        run: python -m kalshi_nba.estadisticas
      - uses: actions/cache@v4
        with:
          path: data/lineups
          key: lineups-data-${{ github.run_id }}
          restore-keys: lineups-data-
      - name: Alineaciones (ESPN; si falla no detiene el resto)
        continue-on-error: true
        run: python -m kalshi_nba.alineaciones
      - name: Picks de jugadores (Kalshi + proyección; si falla no detiene el resto)
        continue-on-error: true
        run: python -m kalshi_nba.jugadores
      - name: Guardar registro
        run: |
          git config user.name  "sports-bot"
          git config user.email "sports-bot@users.noreply.github.com"
          git config merge.keep.driver true        # ver .gitattributes: sin conflictos entre bots
          python -m kalshi_external.final_shadow build
          python -m kalshi_external.final_shadow evaluate || true
          git add predictions/
          git diff --cached --quiet || git commit -m "NBA/NFL $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && break; git rebase --abort 2>/dev/null; sleep $((i*10)); done
          python -m kalshi_nba.resumen
          python -m kalshi_nba.pagina
          python -m kalshi_nba.progreso
          git add PREDICCIONES.md docs/ predictions/combinadas.jsonl predictions/lineups.json predictions/picks_resultados.csv 2>/dev/null || git add PREDICCIONES.md docs/
          git diff --cached --quiet || git commit -m "tabla $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*15)); done
          exit 1
