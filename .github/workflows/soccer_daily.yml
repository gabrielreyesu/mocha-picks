name: soccer-daily

on:
  schedule:
    - cron: "0 7 * * *"      # todos los días 07:00 UTC
  workflow_dispatch: {}        # también se puede lanzar a mano

permissions:
  contents: write              # para guardar el registro de predicciones en el repo

concurrency:
  group: kalshi-escritura      # las dos corridas nunca escriben a la vez
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PROGRESO_CLAVE: ${{ secrets.PROGRESO_CLAVE }}   # clave de los detalles privados de progreso.html
    timeout-minutes: 45         # la primera corrida descarga el historial de las nuevas ligas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (si fallan, no se publica nada)
        run: python -m pytest -q tests
      - name: Evaluar partidos ya jugados
        run: python -m kalshi_soccer.cli evaluate
      - name: Predecir próximos 14 días
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m kalshi_soccer.cli predict --days 14
      - uses: actions/cache@v4
        with:
          path: data/intl
          key: intl-data-${{ github.run_id }}
          restore-keys: intl-data-
      - name: Copas europeas y selecciones (evaluar y predecir)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}     # opcional: cuotas de copas nacionales (the-odds-api.com)
        run: |
          python -m kalshi_intl.cli evaluate
          python -m kalshi_intl.cli predict
      - name: Escudos, banderas y logos (catálogo de ESPN; si falla no detiene el resto)
        continue-on-error: true
        run: python -m kalshi_nba.logos
      - name: Qué se juega cada equipo (aviso informativo; si falla no detiene el resto)
        continue-on-error: true
        run: python -m kalshi_lineup.stakes_now
      - name: Bajas de fútbol (API-Football; si falla no detiene el resto)
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m kalshi_intl.lesiones
      - uses: actions/cache@v4
        with:
          path: data/stats
          key: stats-data-${{ github.run_id }}
          restore-keys: stats-data-
      - name: Estadísticas de equipos para la página (ESPN; si falla no detiene el resto)
        continue-on-error: true
        run: python -m kalshi_nba.estadisticas
      - uses: actions/cache@v4
        with:
          path: data/lineups
          key: lineups-data-${{ github.run_id }}
          restore-keys: lineups-data-
      - name: Alineaciones (ESPN; si falla no detiene el resto)
        continue-on-error: true
        run: python -m kalshi_nba.alineaciones
      - name: Guardar registro (append-only, queda auditado en el historial de git)
        run: |
          git config user.name  "soccer-bot"
          git config user.email "soccer-bot@users.noreply.github.com"
          git config merge.keep.driver true        # ver .gitattributes: sin conflictos entre bots
          mkdir -p predictions
          python -m kalshi_external.final_shadow build
          python -m kalshi_external.final_shadow evaluate || true
          git add predictions/
          git diff --cached --quiet || git commit -m "predicciones $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && break; git rebase --abort 2>/dev/null; sleep $((i*10)); done
          python -m kalshi_nba.resumen
          python -m kalshi_nba.pagina
          python -m kalshi_nba.progreso
          git add PREDICCIONES.md docs/ predictions/combinadas.jsonl predictions/lineups.json predictions/picks_resultados.csv 2>/dev/null || git add PREDICCIONES.md docs/
          git diff --cached --quiet || git commit -m "tabla $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*15)); done
          exit 1
